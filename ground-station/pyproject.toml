[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
  "E501",   # line length — keep diffs focused on real issues
  "B904",   # raise-without-from — HTTPException re-raises are intentional
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Header",
  "fastapi.Query",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
